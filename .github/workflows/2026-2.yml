# 修复版：Build-Padavan-PSG1218_nano
# 用法：整份替换 b-p-m-f/Padavan-KVR 的 .github/workflows/2026.yml，提交到 main 后重跑。
# 修改前的原件已备份为 G:\ybshi\Downloads\2026.yml.orig
# 逐条改动理由见对话说明；[N] 标记对应说明里的编号。
#
# 致命问题回顾：runs-on: ubuntu-20.04 已于 2025-04-15 被 GitHub 完全移除，
# label 不存在时 GitHub 不报错，只会无限排队 "Waiting for a runner..."。

name: Build-Padavan-PSG1218_nano

on:
  workflow_dispatch:

jobs:
  build:
    # [1] 20.04 已下线；22.04 目前仍可用（2027-04-17 停用）。
    #     选 22.04 而不是 24.04，是因为 Padavan 3.4 老工具链和依赖包名在 24.04 上不兼容。
    #     长期方案：runs-on: ubuntu-24.04 + container: ubuntu:20.04（需去掉所有 sudo）。
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    # [2] 防止 wget / 编译无限挂起，卡死也能自动失败并留下日志
    timeout-minutes: 180

    steps:
    # [3] @master 是 2020-07-13 冻结的 v2（Node12）；换成当前正式版。
    #     本流程完全不读仓库文件（源码是 git clone 到 /opt），这一步也可整段删除。
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        # [4] 基础依赖：去掉在 24.04 已消失的老包名，补 python / 32 位运行库
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
          cpio git gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libmpc-dev libmpfr-dev libltdl-dev wget \
          python3 python-is-python3 python3-docutils \
          libc6-i386 lib32z1 lib32stdc++6
        # 22.04 上这两个是过渡包，24.04 上已移除；两种系统都兼容的写法
        sudo apt-get -y install libncurses5-dev libgmp3-dev 2>/dev/null \
          || sudo apt-get -y install libncurses-dev libgmp-dev

    - name: Clone source code
      # [5] dl_toolchain.sh 里的 wget 没有超时设置，下载卡住时能快速失败
      timeout-minutes: 20
      env:
        KERNEL: 3.4
      run: |
        # [6] 先建目录并交给当前用户，避免 /opt 权限导致 git clone / wget 失败
        sudo mkdir -p /opt/rt-n56u /opt/images
        sudo chown -R "$(id -u):$(id -g)" /opt/rt-n56u /opt/images
        git clone --depth=1 https://github.com/fightroad/Padavan-KVR.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh

    - name: Build Firmware
      timeout-minutes: 150
      env:
        TNAME: PSG1218_nano
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config not found"
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config

        # 你加的 ZeroTier：写法正确（先删后追加），官方模板里这两行是注释掉的。
        # 注意：nano 机型 flash 小，若末尾报 firmware image too big，把这两行注释掉重试。
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config

        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/
        # [7] 拷到工作区：新版 upload-artifact 对绝对路径 / root 属主目录的处理有差异
        mkdir -p "$GITHUB_WORKSPACE/firmware"
        sudo cp -f /opt/images/*.trx "$GITHUB_WORKSPACE/firmware/"
        ls -lh "$GITHUB_WORKSPACE/firmware/"

    # [8] @master 是 2020 年的 v1，2024-06-30 起服务端强制拒绝，固件一定拿不到
    - name: Upload packages
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Padavan-packages
        path: firmware
        if-no-files-found: ignore
